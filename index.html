<!DOCTYPE html>
<!--
  index.html = the SKELETON of the website.
  HTML decides WHAT is on the page (title, links, boxes, buttons).
  style.css decides HOW it looks. script.js decides what it DOES.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystics Lair - Video Game Music Arrangements</title>

  <!-- Connects this page to the look (CSS file) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== THE MAIN WRAPPER: keeps everything centered ========== -->
  <div id="wrapper">

    <!-- ===== BOX 1: TITLE ===== -->
    <header id="title-box">
      <h1>Mystics Lair</h1>
      <p class="subtitle">Video Game Music Arrangements &bull; MIDI &amp; MP3</p>
    </header>

    <!-- ===== BOX 2: LINKS + SEARCH BAR (turned off for now) =====
         Everything between the comment markers is hidden from the page.
         To bring the strip back, delete the line that says "OFF START"
         and the line that says "OFF END".
    OFF START
    <nav id="nav-bar">
      <div class="nav-links">
        <a href="index.html">Home</a>
      </div>
      <div class="search">
        <input type="text" id="search-input" placeholder="Search">
        <button type="button" id="search-button">Search</button>
      </div>
    </nav>
    OFF END -->

    <!-- ===== THE ARRANGEMENTS (one box per song) ===== -->
    <main id="arrangements">

      <!-- Small heading bar above the boxes -->
      <h2 class="section-heading">Arrangements</h2>
      <!-- script.js fills in this sentence, e.g. "Showing 1 arrangement" -->
      <p id="count"></p>

      <!--
        ONE ARRANGEMENT = everything between <article> and </article>.
        data-mp3 = the MP3 file the Play button plays.
        data-track = a short name for the song, used in your GoatCounter stats
                     (Play presses show up as "cutman-play").
        The "player" part = the Play button + the Loop button + the seek bar
        (time so far | a line you can drag | total length) + the volume bar (0 to 100).
        The "downloads" part = the two stacked MP3 and MIDI boxes on the right.
        Each box has its own data-goatcounter-click name (like "cutman-mp3"),
        so your stats count MP3 and MIDI downloads separately.
        When you add a new song, give its boxes new names (like "woodman-mp3"),
        and give it a new data-track name too (like data-track="woodman").
        To add a new one: copy a whole <article>...</article> block,
        paste it below the last one, and change the file names and text.
      -->

      <!-- ---------- Arrangement 1 ---------- -->
      <article class="arrangement" data-mp3="music/Mega_Man_-_Cut_Man_Theme.mp3" data-track="cutman">
        <img class="cover" src="images/megaman.png" alt="Mega Man logo">
        <div class="info">
          <h3 class="track-title">Cut Man Theme</h3>
          <p class="details"><b>Mega Man</b> &bull; 11/23/2026</p>
          <!-- DESCRIPTION OFF START (to bring it back, delete this line and the "OFF END" line)
          <p class="description">A short sentence about this arrangement.</p>
          DESCRIPTION OFF END -->
          <div class="player">
            <button type="button" class="play-button">&#9658; Play</button>
            <!-- Loop button: click once = ON (looks pushed in), click again = OFF.
                 aria-pressed tells screen readers whether it's on ("true") or off ("false"). -->
            <button type="button" class="loop-button" aria-pressed="false" title="Repeat this song">&#8635; Loop</button>
            <div class="seek-bar">
              <span class="time-current">0:00</span>
              <input type="range" class="seek" min="0" max="0" step="0.1" value="0" aria-label="Song position">
              <span class="time-total">0:00</span>
            </div>
            <!-- Volume: drag the line from 0 (silent) to 100 (full).
                 The number after it shows the volume. -->
            <div class="volume-bar">
              <span class="volume-label">Vol</span>
              <input type="range" class="volume" min="0" max="100" step="1" value="100" aria-label="Volume">
              <span class="volume-number">100</span>
            </div>
          </div>
        </div>
        <div class="downloads">
          <!-- data-goatcounter-click = the name this download shows up as in your stats -->
          <a class="download-box" href="music/Mega_Man_-_Cut_Man_Theme.mp3" download
             data-goatcounter-click="cutman-mp3" data-goatcounter-title="Cut Man Theme - MP3 download">MP3</a>
          <a class="download-box" href="midi/Megaman_Cutman_Theme.mid" download
             data-goatcounter-click="cutman-midi" data-goatcounter-title="Cut Man Theme - MIDI download">MIDI</a>
        </div>
      </article>

      <!-- Shown by script.js only when the search finds nothing -->
      <p id="no-results" hidden>No arrangements match your search.</p>

    </main>


  </div>

  <!-- Connects this page to the behavior (JavaScript file). It goes LAST so the page loads first. -->
  <script src="script.js"></script>

  <!-- GoatCounter: counts visits to the site, MP3 / MIDI downloads, and Play presses.
       Only you can see the numbers, at https://mysticslair.goatcounter.com
       "async" = load it in the background so it never slows the page down. -->
  <script data-goatcounter="https://mysticslair.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
